[package]
name = "grovefs-mac"
version = "0.1.0"
edition = "2021"
description = "Native macOS client that mounts a GroveFS view as a directory (macFUSE)"
license = "MIT"

# The macOS mount path is the SAME `GroveFS` FUSE implementation the Linux
# `grovefs mount` uses; only the kernel bridge host differs (macFUSE vs Linux
# FUSE). It builds and runs on any UNIX host with fuser's pure-Rust mount, which
# keeps the client testable in CI; a real macOS build probes macFUSE 4.x with
# pkg-config (see README).

[[bin]]
name = "grovefs-mac"
path = "src/main.rs"

[dependencies]
# The client seam: RemoteMeta + RemoteBackend + wire protocol (`remote-only`),
# plus the FUSE bridge + real POSIX shims (`fuse-bridge`) — NOT the on-disk
# engine or the cluster servers, so no rusqlite/postgres/tokio.
grovefs = { path = "../../grovefs", default-features = false, features = ["remote-only", "fuse-bridge"] }
# Kernel FUSE session (macFUSE on macOS, the pure-Rust mount on Linux).
fuser = "0.18"
# CLI parsing (cross-platform).
clap = { version = "4", features = ["derive"] }
# Clean Ctrl-C -> unmount shutdown.
ctrlc = "3"
