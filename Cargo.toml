[workspace]
resolver = "2"
# Platform-native GroveFS clients. Both shells talk to the SAME cluster services
# over the SAME framed protocol through grovefs's `remote-only` feature (no
# fuser/libc, no metadata engine): `win` mounts via WinFsp, `mac` will mount via
# macFUSE. The Linux FUSE mount/server stays in the main `grovefs` crate.
members = ["win", "mac"]

[profile.release]
lto = true
